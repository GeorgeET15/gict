[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gict-iphone-copy-tool"
version = "1.0.0"
description = "A non-destructive, integrity-verified iPhone media copier"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "GICT contributors" }
]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/GeorgeET15/gict-portable"
Repository = "https://github.com/GeorgeET15/gict-portable"

[project.scripts]
gict = "gict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
