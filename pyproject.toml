[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gict-iphone-copy-tool"
version = "0.1.0"
description = "A non-destructive, integrity-verified iPhone media copier"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "GICT contributors" }
]
dependencies = []

[project.scripts]
gict-dev = "gict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
